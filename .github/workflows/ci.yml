name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # pnpm 11 itself needs Node 22.13+, so the toolchain runs on 22/24.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - name: Audit dependencies (fail on high/critical)
        run: pnpm audit --audit-level high

  node-20-runtime:
    # The published CLI supports Node 20+: build with 24, run the output on 20.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Smoke test on Node 20
        run: |
          node dist/index.js --version
          node dist/index.js --help > /dev/null
          EIT_CONFIG_DIR="$RUNNER_TEMP/eit" node dist/index.js status
